<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Reviews - HydroMax</title>
    <link rel="stylesheet" href="/review/style.css">
</head>

<body>

    <nav>
        <div class="logo">💧 HydroMax Shop</div>

        <div class="nav-links">
            <span>Welcome, <b id="navUsername"></b></span>
            <a href="/product/retrieve/">Products</a>
            <a href="/review/create/">Write a Review</a>
            <button onclick="logout()">Logout</button>
        </div>
    </nav>

    <main class="container">

        <h1>My Reviews</h1>

        <p class="subtitle" id="reviewCount">
            Manage your product reviews.
        </p>

        <div id="message" class="message"></div>

        <div id="reviewList"></div>

        <div class="actions">
            <a href="/review/create/" class="btn">
                + Write a Review
            </a>

            <a href="/product/retrieve/"
               class="btn btn-secondary">
                Back to Products
            </a>
        </div>

    </main>

    <footer>© HydroMax Shop | ST0525 Database Systems CA1</footer>

    <script src="/review/common.js"></script>
    <script src="/review/retrieve/all/script.js"></script>

</html>
